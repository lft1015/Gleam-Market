services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: gleam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-liao2004}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gleam_market}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./resource/sql/Gleam_market.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: gleam-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3.12-management-alpine
    container_name: gleam-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gleam}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gleam-market}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  upload-init:
    image: docker.m.daocloud.io/library/alpine:3.20
    container_name: gleam-upload-init
    restart: "no"
    command: ["sh", "-c", "mkdir -p /app/uploads && chown -R 100:101 /app/uploads"]
    volumes:
      - upload-data:/app/uploads

  app:
    build: .
    container_name: gleam-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gleam_market}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-liao2004}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-gleam}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-gleam-market}
      APP_RABBITMQ_ENABLED: "true"
      APP_UPLOAD_DIRECTORY: /app/uploads
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_NICKNAME: ${APP_ADMIN_NICKNAME:-平台管理员}
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      upload-init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  upload-data:

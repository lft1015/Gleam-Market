# Web
server:
  port: 8080
  servlet:
    context-path: /api/v1

# MySQL
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gleam_market?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci}"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:liao2004}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000ms
          max-attempts: 3
          multiplier: 2

# 应用自定义配置
app:
  jwt:
    secret: 8f7d3a9b2e6c1f4a5d0e8b7c9a3f6d2e1c4b7a9f3d6e8f1a5c2b4d7e0f9a6c}
  upload:
    directory: ${APP_UPLOAD_DIRECTORY:./uploads}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    nickname: ${APP_ADMIN_NICKNAME:平台管理员}